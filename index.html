<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Star wars</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Acme&family=Handlee&display=swap" rel="stylesheet">
</head>
<body>
    <div id="app">

        <div class="top">
            <div>
                <h1>{{ title }}</h1>
                <small>Olá, Seja muito bem vindo(a)!</small>
            </div>
            <form action="#">
                <input placeholder="Busca por nome..." v-model="searchName"/>
                <button type="button" @click="search()">Buscar</button>
            </form>
        </div>

        <div class="characters">
            <div class="item" v-for="item of characters">
                <img :src="item.avatar" :alt="item.nome">
                <p>{{item.nome}}</p>
                <span @click="like(item.nome)" class="like material-symbols-outlined">
                    favorite
                </span>
                <span @click="remove(item.id)" class="delete material-symbols-outlined">
                    delete
                </span>
            </div>
        </div>
    </div>

    

<script src="js/vue.js"></script>
<script src="js/app.js"></script>
</body>
</html>

<!--O v-for serve paea repetir um elemento de forma automática com base nos itens de uma lista ou array.-->
<!--Através do da propriedade v-model eu consigo referenciar o valor desse campo com um objeto na minha camada de JS.-->
